<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokerole 3.0 隨機產生器</title>
<style>
  /* 你的 CSS 樣式保持不變 */
  body { font-family: sans-serif; background: #f2f5f0; color: #202b29; padding: 20px; }
  .pokemon-avatar { width: 90px; height: 90px; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid #dce5df; padding: 4px; }
  .table-avatar { width: 32px; height: 32px; object-fit: contain; vertical-align: middle; margin-right: 6px; }
  /* 其他排版樣式... */
</style>
<!-- 引入你的資料檔案 -->
<script src="data.js"></script>
</head>
<body>
<div id="app">
  <h1>Pokerole 3.0 隨機產生器</h1>
  
  <!-- 顯示選中寶可夢的區域 -->
  <div id="result">
    <!-- 動態渲染 -->
  </div>

  <!-- 圖鑑清單 -->
  <table>
    <thead><tr><th>編號</th><th>寶可夢</th><th>屬性</th><th>建議階級</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script>
// 初始化渲染邏輯
function initApp() {
  const tbody = document.getElementById("list");
  tbody.innerHTML = "";

  POKEMON_DATABASE.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.no}</td>
      <td><img class="table-avatar" src="${p.image}" alt="${p.cn}">${p.cn}</td>
      <td>${p.types.join("/")}</td>
      <td>${p.tier}</td>
    `;
    tr.addEventListener("click", () => selectPokemon(p));
    tbody.appendChild(tr);
  });

  // 預設選中第一隻
  if (POKEMON_DATABASE.length > 0) {
    selectPokemon(POKEMON_DATABASE[0]);
  }
}

function selectPokemon(p) {
  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = `
    <h2>${p.cn} (${p.en})</h2>
    <img class="pokemon-avatar" src="${p.image}" alt="${p.cn}">
    <p>屬性：${p.types.join("/")} | 階級：${p.tier} | 特性：${p.traits.join(" / ")}</p>
  `;
}

window.onload = initApp;
</script>
</body>
</html>
